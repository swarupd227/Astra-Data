# S1.1.3 criterion 2: "A replay of the event stream from empty produces a graph identical
# to the live graph (verified by a nightly CI job on the test estate)."
#
# Seeds the test estate, rebuilds it from nothing but the mutation events, and compares
# the two graphs element by element. A failure means the record and the estate disagree,
# which is a defect in the platform's evidence, not a flaky test.

name: Nightly replay verification

on:
  schedule:
    # 02:00 UTC daily.
    - cron: "0 2 * * *"
  workflow_dispatch:

jobs:
  replay:
    name: Event stream reproduces the estate
    runs-on: ubuntu-latest

    services:
      postgres:
        image: apache/age:release_PG16_1.6.0
        env:
          POSTGRES_DB: astra
          POSTGRES_USER: astra
          POSTGRES_PASSWORD: astra_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U astra -d astra"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      ASTRA_POSTGRES_HOST: localhost
      ASTRA_POSTGRES_PORT: "5432"
      ASTRA_POSTGRES_DB: astra
      ASTRA_POSTGRES_USER: astra
      ASTRA_POSTGRES_PASSWORD: astra_ci
      ASTRA_GRAPH_NAME: astra_estate_nightly

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: python -m pip install -e "services/graph-svc[dev]"

      - name: Migrate
        working-directory: services/graph-svc
        run: python tools/migrate.py

      - name: Seed the test estate
        working-directory: services/graph-svc
        run: python tools/seed_test_estate.py --workbooks 25

      - name: Verify the event stream reproduces the estate
        working-directory: services/graph-svc
        run: python tools/verify_replay.py

      - name: Database log on failure
        if: failure()
        run: docker logs "${{ job.services.postgres.id }}" --tail 100
