# The console's server block.
#
# It does two jobs: serve the SPA, and proxy /v1 to graph-svc so the browser makes
# same-origin calls. Same-origin is the point — it means no CORS policy exists to be
# widened later, and the identity headers the service reads never cross an origin.

upstream graph_svc {
    # Overridden per environment by the container platform's service discovery. The name
    # is the compose service name locally and the Container App name on Azure.
    server graph-svc:8080;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # A console that leaks its version and server software to every visitor is telling an
    # attacker which advisories to read.
    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    # The bundle is self-contained: no CDN, no inline script, no remote fonts. Saying so
    # here is what stops the first person who wants a widget from quietly adding one.
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Hashed asset filenames, so they can be cached hard. index.html must not be, or a
    # deploy leaves browsers on the previous bundle until they clear their cache.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /v1/ {
        proxy_pass http://graph_svc;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # A harvest of a large site is minutes of work behind one request.
        proxy_read_timeout 300s;
    }

    location /graphql {
        proxy_pass http://graph_svc;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Deep links are the SPA's, not the file system's: /estate?site=rqa is a screen.
    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
