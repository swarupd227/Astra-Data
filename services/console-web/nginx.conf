# The console's server block.
#
# It does two jobs: serve the SPA, and proxy /v1 to graph-svc so the browser makes
# same-origin calls. Same-origin is the point — it means no CORS policy exists to be
# widened later, and the identity headers the service reads never cross an origin.
#
# This is a template (nginx's own image auto-envsubst's files under
# /etc/nginx/templates/ at container start — see the Dockerfile). $GRAPH_SVC_UPSTREAM,
# $GRAPH_SVC_HOST and $DNS_RESOLVER are the substituted tokens; nginx's own request-time
# variables ($host, $scheme, ...) below are untouched since envsubst only replaces names
# matching an actual environment variable, and none of nginx's own lowercase variable
# names collide with one. Defaults (set in the Dockerfile) match this platform's own
# deployed Azure Container Apps environment (story S5.3.2's own deployment, whose
# internal service-to-service HTTP routing did not work, and whose own DNS is Azure's
# well-known internal resolver) — a deployment whose routing differs, local Docker
# Compose included (story S5.5.3's own finding: the Azure-only resolver default left
# every `/v1/*` call 502ing here, silently, since no story before this one actually
# loaded the console through its own nginx proxy to notice), overrides all three; see
# docker-compose.yml's own `console-web` service for the local override.

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # A plain `proxy_pass $GRAPH_SVC_UPSTREAM` resolves the hostname exactly once, when
    # this worker starts, and never again -- if the resolved address later stops
    # answering (Azure Container Apps' own external ingress endpoint appears to rotate
    # IPs; a Docker Compose container recreated under the same service name gets a new
    # one too), every request hangs until the worker itself restarts. Naming the upstream
    # in a variable forces nginx to re-resolve it per request instead, respecting
    # whichever resolver's own short TTL -- Azure's well-known internal one by default
    # (below), Docker Compose's own embedded resolver (127.0.0.11) when running locally.
    resolver ${DNS_RESOLVER} valid=10s;
    set $graph_svc_upstream ${GRAPH_SVC_UPSTREAM};
    # This environment's external ingress shares one IP across every app and routes by
    # the HTTP Host header, not just TLS SNI -- forwarding the console's own Host (as
    # $host would) sent every /v1/ request back to the console itself, an infinite loop
    # (visible as an ever-growing X-Forwarded-For chain until the client gave up).
    # $GRAPH_SVC_HOST names the real upstream host so the edge routes to graph-svc, not
    # back to this app.
    set $graph_svc_host ${GRAPH_SVC_HOST};

    # A console that leaks its version and server software to every visitor is telling an
    # attacker which advisories to read.
    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    # The bundle is self-contained: no CDN, no inline script, no remote fonts. Saying so
    # here is what stops the first person who wants a widget from quietly adding one.
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Hashed asset filenames, so they can be cached hard. index.html must not be, or a
    # deploy leaves browsers on the previous bundle until they clear their cache.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /v1/ {
        proxy_pass $graph_svc_upstream;
        proxy_ssl_server_name on;
        # The default 4k/8k header buffer is too small once the upstream is reached
        # through Azure Container Apps' own external edge layer (S5.3.2's own deployment
        # workaround, see the file-level comment) rather than a direct internal hop.
        proxy_buffer_size 16k;
        proxy_buffers 4 16k;
        proxy_http_version 1.1;
        proxy_set_header Host $graph_svc_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # A harvest of a large site is minutes of work behind one request.
        proxy_read_timeout 300s;
    }

    location /graphql {
        proxy_pass $graph_svc_upstream;
        proxy_ssl_server_name on;
        proxy_buffer_size 16k;
        proxy_buffers 4 16k;
        proxy_http_version 1.1;
        proxy_set_header Host $graph_svc_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Deep links are the SPA's, not the file system's: /estate?site=rqa is a screen.
    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
