[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "astra-graph-svc"
version = "0.1.0"
description = "Astra Data Estate Graph service"
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
    "fastapi>=0.115,<0.116",
    "uvicorn[standard]>=0.32,<0.35",
    "asyncpg>=0.30,<0.31",
    "pydantic>=2.9,<3",
    "strawberry-graphql[fastapi]>=0.240,<0.300",
    # The published 00a76.1 contract, the adapter RPC and the fake source (S2.1.1). graph-svc
    # consumes it on the same terms an adapter author does 2014 that is what makes "a second
    # source can be added without changing the platform" a checkable claim.
    # [target]: the fixture target adapter's real Git commits (story S4.3.1, Dulwich).
    "astra-adapter-sdk[target]",
    # The Model Gateway's own real Anthropic provider (story S5.3.2, §5.5).
    "anthropic>=1.0,<2",
    # PBIR schema validation before commit (story S6.1.1, §7.1). See pbir.py's own
    # docstring for what "the PBIR JSON schema" means in this codebase today.
    "jsonschema>=4,<5",
    # Both ResultSets stored as Parquet (story S7.3.1, §10.2). pyarrow alone, not pandas:
    # it is the reference Parquet implementation everything else (including pandas)
    # delegates to, and `pyarrow.parquet.write_table` needs nothing else to turn a
    # ResultSet's own columns/rows into bytes -- a second dependency this codebase does
    # not otherwise need.
    "pyarrow>=17,<19",
    # §10.5's own perceptual image comparison (story S7.6.1). Pillow decodes whatever
    # media type a capture/render actually returns and computes a real, deterministic
    # average-hash similarity -- graph-svc's own need, the identical "this story needs
    # it, added here rather than a shared package" precedent pyarrow already set.
    "Pillow>=10,<12",
    # The Status Pack's own real PDF/PPTX export (story S10.2.1, §15.3.1). Both are the
    # reference open-source library for their own format -- the identical "this story
    # needs it, added here rather than a shared package" precedent pyarrow/Pillow already
    # set.
    "reportlab>=4,<5",
    "python-pptx>=1,<2",
    # E11's own real, disclosed-not-yet-connected pieces (story S11.1.1, §18.1/§4.5).
    # httpx: JWKS fetch for Entra ID token validation (entra.py) -- promoted from dev-only
    # now that it is a real runtime dependency, not just the test client.
    "httpx>=0.27,<0.29",
    # PyJWT: verifies Entra ID's RS256 tokens against the tenant's own published JWKS.
    "pyjwt[crypto]>=2.9,<3",
    # cryptography: the Ed25519 signature on the deployment bill of materials (bom.py) --
    # a real cryptographic signature, not this codebase's existing textual "signed"
    # attestation convention (decision_register.py/calibration_wave.py), because E11's own
    # goal is a tamper-evident chain, and a rendered PDF footer does not provide that.
    "cryptography>=43,<44",
    # azure-identity/azure-keyvault-secrets: KeyVaultCredentialProvider (credentials.py's
    # own CredentialProvider protocol) and the Key Vault-backed secret path for Fabric/
    # Tableau service principals. Real client libraries; the deployed tenant they talk to
    # does not exist yet (disclosed throughout -- see docs/adr/0079).
    "azure-identity>=1.19,<2",
    "azure-keyvault-secrets>=4.9,<5",
    # azure-identity's *async* credential chain (KeyVaultCredentialProvider,
    # credentials.py) needs an async HTTP transport to actually make a request; without
    # it, DefaultAzureCredential fails at construction, not just at call time.
    "aiohttp>=3.10,<4",
    # tools/generate_bom.py reads the real Helm values.yaml a deployment used, to hash it
    # into the bill of materials (bom.py) -- the reference YAML parser, the same
    # "this story needs it, added here" precedent pyarrow/Pillow/reportlab already set.
    "PyYAML>=6,<7",
    # The real orchestrator (story S12.1.1, §5.4, E12/F12.1) -- durable, resumable MU
    # workflows. The Helm chart's own `temporal.enabled` dependency (deploy/helm/
    # astra-data/Chart.yaml) already pins the *server*; this is the first story to add
    # the client/worker SDK that actually talks to it.
    "temporalio>=1.7,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<1",
    "ruff>=0.7,<0.13",
    "mypy>=1.13,<2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/astra_graph"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: requires PostgreSQL with Apache AGE (make dev-up)",
    "slow: seeds a large estate; minutes, not seconds",
]
filterwarnings = [
    "error::DeprecationWarning:astra_graph.*",
    # The parse-quality API's request field is called `construct`, which is the domain
    # word and the wire name; Pydantic warns because BaseModel has a deprecated
    # `construct` classmethod. See routes_quality.IgnorableRequest.
    'ignore:Field name "construct".*shadows an attribute:UserWarning',
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "tools"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
    # The ontology declarations are long literal tables; splitting them for line length
    # makes them harder to check against the specification, not easier.
    "E501",
]

# The console reads these strings. An en dash is the right character for a numeric range
# ("98–99%") and an em dash for an aside, and the specification this service implements
# uses both throughout — a hyphen in their place would be a typographic error a user sees.
allowed-confusables = ["–", "—", "’"]

[tool.ruff.lint.per-file-ignores]
"src/astra_graph/ontology/nodes.py" = ["E501"]
"src/astra_graph/ontology/edges.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
packages = ["astra_graph"]
mypy_path = "src"
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = "asyncpg.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "jsonschema.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "pyarrow.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "PIL.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "reportlab.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "pptx.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "jwt.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "azure.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "yaml.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Object types are generated from the ontology registry at import time, so their
# fields do not exist for a static checker to see (api/graphql/types.py).
module = "astra_graph.api.graphql.*"
# Object types are built from the ontology registry at import time, so their fields do
# not exist for a static checker to see, and Strawberry's decorators are untyped at the
# version pinned here. The generated schema is asserted against the registry in
# tests/test_graphql.py instead.
disallow_any_explicit = false
disallow_untyped_decorators = false
warn_return_any = false
warn_unused_ignores = false
