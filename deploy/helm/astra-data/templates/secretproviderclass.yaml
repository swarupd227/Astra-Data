{{/*
Story S11.1.1, spec §18.1: secrets come from Key Vault, never from a plain Kubernetes
Secret someone typed a value into. The Secrets Store CSI driver (deploy/terraform's own
`key_vault_secrets_provider` AKS addon) mounts the named Key Vault secrets as files, and
`secretObjects` below additionally syncs them into a real Kubernetes Secret -- the shape
graph-svc's own `config.py` (a plain `ASTRA_POSTGRES_PASSWORD` env var) actually needs,
since a FastAPI process reads its config from the environment, not from a mounted file.
*/}}
{{- if .Values.graphSvc.keyVault.enabled }}
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ include "astra-data.fullname" . }}-graph-svc-kv
  labels:
    {{- include "astra-data.graphSvc.labels" . | nindent 4 }}
spec:
  provider: azure
  secretObjects:
    - secretName: {{ include "astra-data.fullname" . }}-graph-svc-secrets
      type: Opaque
      data:
        - objectName: astra-postgres-password
          key: ASTRA_POSTGRES_PASSWORD
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "true"
    userAssignedIdentityID: {{ .Values.graphSvc.keyVault.userAssignedIdentityClientId | quote }}
    keyvaultName: {{ .Values.graphSvc.keyVault.name | quote }}
    tenantId: {{ .Values.graphSvc.keyVault.tenantId | quote }}
    objects: |
      array:
        {{- range .Values.graphSvc.keyVault.secrets }}
        - |
          objectName: {{ .keyVaultSecretName }}
          objectAlias: {{ .objectName }}
          objectType: secret
          objectVersion: ""
        {{- end }}
{{- end }}
