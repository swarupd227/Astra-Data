# Local development only. The deployed topology is AKS + Azure Database for PostgreSQL
# (spec 5.3); this file exists so the same images and migrations run on a laptop.

name: astra-data

services:
  postgres:
    # Apache AGE ships as a PostgreSQL image with the extension preinstalled.
    # Pinned to an explicit release so local and CI run the same PostgreSQL and AGE.
    image: apache/age:release_PG16_1.6.0
    environment:
      POSTGRES_DB: ${ASTRA_POSTGRES_DB:-astra}
      POSTGRES_USER: ${ASTRA_POSTGRES_USER:-astra}
      POSTGRES_PASSWORD: ${ASTRA_POSTGRES_PASSWORD:-astra_local_dev_only}
    ports:
      - "${ASTRA_POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${ASTRA_POSTGRES_USER:-astra} -d ${ASTRA_POSTGRES_DB:-astra}"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Story S12.1.1, spec §5.4/§14.1: the real Temporal server every MU workflow runs on.
  # `auto-setup` is Temporal's own real image for exactly this -- on first start it
  # creates the `temporal`/`temporal_visibility` databases on the shared `postgres`
  # service and the schema in them itself, then creates the `default` namespace
  # automatically (the same namespace `config.py`'s own `temporal_namespace` default
  # names, and the Helm chart's own `deploy/helm/astra-data/values.yaml` already names
  # for the real AKS deployment, pointed at the same shared Postgres server there too).
  temporal:
    image: temporalio/auto-setup:1.24.2
    environment:
      DB: postgresql
      DB_PORT: 5432
      POSTGRES_USER: ${ASTRA_POSTGRES_USER:-astra}
      POSTGRES_PWD: ${ASTRA_POSTGRES_PASSWORD:-astra_local_dev_only}
      POSTGRES_SEEDS: postgres
    ports:
      - "${ASTRA_TEMPORAL_PORT:-7233}:7233"
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ["service"]

  # The real Temporal Web UI -- watch a real `MigrationUnitWorkflow` run, its own real
  # activity history, and send a real gate-decision signal by hand, all without needing
  # `tctl`/`temporal` CLI installed locally.
  temporal-ui:
    image: temporalio/ui:2.31.3
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:${ASTRA_TEMPORAL_UI_PORT:-8088}
    ports:
      - "${ASTRA_TEMPORAL_UI_PORT:-8088}:8080"
    depends_on:
      - temporal
    profiles: ["service"]

  # The real Temporal worker process (`mu_worker.py`) -- polls `TASK_QUEUE` and actually
  # runs `MigrationUnitWorkflow` and its activities. `graph-svc` itself only starts a
  # workflow/signals a gate/reads status (`routes_mu_workflow.py`); nothing executes a
  # workflow's own real code without a worker like this one polling for it, the same
  # "API pod vs. worker pod" split spec §5.4 already draws for every other agent role.
  graph-svc-worker:
    build:
      context: .
      dockerfile: ./services/graph-svc/Dockerfile
    command: ["python", "-m", "astra_graph.mu_worker"]
    environment:
      ASTRA_POSTGRES_HOST: postgres
      ASTRA_POSTGRES_PORT: 5432
      ASTRA_POSTGRES_DB: ${ASTRA_POSTGRES_DB:-astra}
      ASTRA_POSTGRES_USER: ${ASTRA_POSTGRES_USER:-astra}
      ASTRA_POSTGRES_PASSWORD: ${ASTRA_POSTGRES_PASSWORD:-astra_local_dev_only}
      ASTRA_GRAPH_NAME: ${ASTRA_GRAPH_NAME:-astra_estate}
      ASTRA_ENV: local
      # This worker never touches the Tableau fixture adapter (no harvest runs here),
      # so unlike `graph-svc` it carries no `ASTRA_CREDENTIAL_TABLEAU_*` fixture
      # values -- nothing here would use them.
      ASTRA_TEMPORAL_ADDRESS: temporal:7233
    depends_on:
      postgres:
        condition: service_healthy
      # `service_started`, not `service_healthy`: `auto-setup` has no built-in healthcheck
      # this file adds one for, so a worker that starts before Temporal's own schema setup
      # finishes just fails its first connection and needs a restart -- the identical
      # "disclosed, not fatal" posture `main.py`'s own lifespan already gives `graph-svc`
      # itself for this exact dependency (see its own comment there).
      temporal:
        condition: service_started
    profiles: ["service"]

  graph-svc:
    build:
      # Repository root, so the image can build the sibling adapter SDK it depends on.
      context: .
      dockerfile: ./services/graph-svc/Dockerfile
    environment:
      ASTRA_POSTGRES_HOST: postgres
      ASTRA_POSTGRES_PORT: 5432
      ASTRA_POSTGRES_DB: ${ASTRA_POSTGRES_DB:-astra}
      ASTRA_POSTGRES_USER: ${ASTRA_POSTGRES_USER:-astra}
      ASTRA_POSTGRES_PASSWORD: ${ASTRA_POSTGRES_PASSWORD:-astra_local_dev_only}
      ASTRA_GRAPH_NAME: ${ASTRA_GRAPH_NAME:-astra_estate}
      ASTRA_ENV: local
      # Story S12.1.1: the real Temporal client `routes_mu_workflow.py` starts a
      # workflow, signals a gate, or reads live status through (`main.py`'s own lifespan).
      ASTRA_TEMPORAL_ADDRESS: temporal:7233
      # The fixture adapter's credentials. Not secrets: the fixture estate is generated,
      # accepts any token, and is only reachable because ASTRA_ENV is local. Present so
      # that `docker compose up` gives a stack a harvest can actually run on — without
      # them the first harvest fails on a missing credential and the console shows an
      # empty estate with no hint why.
      ASTRA_CREDENTIAL_TABLEAU_RQA: fixture-local-only
      ASTRA_CREDENTIAL_TABLEAU_GTAA: fixture-local-only
      # Set to an adapter worker's base URL to harvest out of process over the §6.1 RPC
      # (S2.1.1), which is how an adapter is actually deployed — §5.2 makes it a worker and
      # §5.4 runs it as its own pod. Unset, the platform uses the in-process fixture adapter,
      # which is what the local demo wants: one container, one estate, nothing to start.
      #   ASTRA_ADAPTER_URL: http://adapter-fake:8090
      # The Model Gateway's own real Anthropic provider (story S5.3.2). Unset locally on
      # purpose — a real deployment secret, not a fixture value like the credentials
      # above. Without it, POST /v1/model-gateway:run-eval fails each case with a real
      # CredentialError; set it from your own shell environment (never committed) to
      # exercise the gateway against a real model.
      #   ASTRA_CREDENTIAL_ANTHROPIC_API_KEY: ${ASTRA_CREDENTIAL_ANTHROPIC_API_KEY:-}
      # Story S11.1.1: Entra ID sign-in, Key Vault-backed credentials, and the deployment
      # bill of materials' own public key -- all disclosed, not yet connected (entra.py's
      # own module docstring). Unset locally on purpose, the honest default this whole
      # story's own local stack runs under; set any of them from your own shell
      # environment (never committed) to exercise that one real path against a live
      # tenant/vault/key instead of the existing header-asserted identity.
      #   ASTRA_ENTRA_TENANT_ID: ${ASTRA_ENTRA_TENANT_ID:-}
      #   ASTRA_ENTRA_CLIENT_ID: ${ASTRA_ENTRA_CLIENT_ID:-}
      #   ASTRA_ENTRA_GROUP_ROLE_MAP: ${ASTRA_ENTRA_GROUP_ROLE_MAP:-}
      #   ASTRA_KEY_VAULT_URL: ${ASTRA_KEY_VAULT_URL:-}
      #   ASTRA_BOM_PUBLIC_KEY_PEM: ${ASTRA_BOM_PUBLIC_KEY_PEM:-}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      temporal:
        condition: service_started
    profiles: ["service"]

  console-web:
    # The Migration Console. Served by nginx, which also proxies /v1 to graph-svc so the
    # browser makes same-origin calls and no CORS policy has to exist.
    build:
      context: ./services/console-web
      args:
        VITE_ASTRA_ENV: local
    ports:
      - "${ASTRA_CONSOLE_PORT:-5173}:8080"
    environment:
      # The image's own default resolver (168.63.129.16) is Azure Container Apps' own
      # internal DNS server (story S5.3.2's deployment) -- unreachable and meaningless
      # here, and left every /v1/* call through this proxy 502ing silently until story
      # S5.5.3's own first real browser test of a console screen actually noticed.
      # Docker Compose's own embedded resolver, so nginx can re-resolve `graph-svc` per
      # request (a recreated container gets a new address) the same way the Azure
      # deployment already relies on being able to for its own ingress endpoint.
      DNS_RESOLVER: "127.0.0.11"
    depends_on:
      - graph-svc
    profiles: ["service"]

volumes:
  postgres-data:
